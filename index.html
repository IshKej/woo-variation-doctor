<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Woo Variation Doctor - AamirTechs</title>
<style>
:root{--navy:#0b1f3a;--gold:#d4a72c;--bg:#f6f8fb;--ink:#1c2733;--muted:#5b6b7c;--line:#d9e1ea}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--navy);color:#fff;padding:28px 20px;border-bottom:4px solid var(--gold)}
header .wrap{max-width:880px;margin:0 auto}
header h1{margin:0 0 6px;font-size:1.6rem}
header p{margin:0;color:#c8d4e4}
main{max-width:880px;margin:24px auto;padding:0 20px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(11,31,58,.08)}
label{display:block;font-weight:600;margin:14px 0 6px}
.card>label:first-child{margin-top:0}
textarea{width:100%;min-height:180px;padding:10px;border:1px solid var(--line);border-radius:8px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.85rem}
input[type=text],input[type=number],select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:.95rem;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:4px}
.grid label{margin:0 0 6px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
button{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:.95rem;cursor:pointer}
button.alt{background:#fff;color:var(--navy);border:1px solid var(--navy)}
button.gold{background:var(--gold);color:#0b1f3a;font-weight:600}
pre{background:#0b1f3a;color:#eef3f9;border-radius:8px;padding:16px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;min-height:60px;font-size:.85rem}
footer{max-width:880px;margin:0 auto 32px;padding:0 20px;color:var(--muted);font-size:.9rem}
footer a{color:var(--navy)}
.hint{color:var(--muted);font-size:.85rem;margin-top:6px;font-weight:400}
</style>
</head>
<body>
<header><div class="wrap"><h1>Woo Variation Doctor</h1><p>Audit a WooCommerce product variations CSV export for unpriced, mispriced, and duplicated variations.</p></div></header>
<main><div class="card">
<label for="file">Input CSV file</label>
<input type="file" id="file" accept=".csv,text/csv">
<label for="input">Or paste the variations CSV</label>
<textarea id="input" spellcheck="false" placeholder="Paste a WooCommerce variations CSV export here, or load the sample."></textarea>
<label>Options</label>
<div class="grid">
<div><label for="opt-maxvar">Max variations <span class="hint">(--max-variations)</span></label><input type="number" id="opt-maxvar" step="1" value="50"></div>
<div><label for="opt-asof">As of date <span class="hint">(--as-of, blank means today)</span></label><input type="text" id="opt-asof" placeholder="2026-11-18"></div>
</div>
<div class="row"><button class="gold" id="run" type="button">Run check</button><button class="alt" id="sample" type="button">Load sample</button><button class="alt" id="download" type="button">Download report</button></div>
<label for="out">Report</label>
<pre id="out">Your report will appear here.</pre>
</div></main>
<footer>
<p>Built by AamirTechs. <a href="https://aamirtechs.github.io/">All tools</a> | <a href="https://github.com/aamirtechs/woo-variation-doctor">Source</a></p>
<p>Privacy: this tool runs 100% in your browser, nothing is uploaded.</p>
</footer>

  var findings = parsed.findings.concat(audit(variations, todayDays, maxVariations));
  var errors = findings.filter(function (f) { return f.severity === "error"; }).length;
  var warnings = findings.length - errors;
  var onSale = variations.filter(function (v) { return v.salePrice !== null; }).length;
  var noPrice = findings.filter(function (f) { return f.rule === "no-price"; }).length;
  var dupSkus = findings.filter(function (f) { return f.rule === "duplicate-sku"; }).length;
  var parentMap = {};
  variations.forEach(function (variation) {
    var parentId = variation.parentId || "(no parent)";
    var entry = parentMap[parentId] || (parentMap[parentId] = { parent: parentId, variations: 0, prices: [], onSale: 0 });
    entry.variations += 1;
    if (variation.regularPrice !== null) entry.prices.push(variation.regularPrice);
    if (variation.salePrice !== null) entry.onSale += 1;
  });
  var perParent = Object.keys(parentMap).sort().map(function (k) {
    var e = parentMap[k];
    var minPrice = null, maxPrice = null;
    e.prices.forEach(function (p) {
      if (minPrice === null || decCmp(p, minPrice) < 0) minPrice = p;
      if (maxPrice === null || decCmp(p, maxPrice) > 0) maxPrice = p;
    });
    return { parent: e.parent, variations: e.variations, minPrice: minPrice, maxPrice: maxPrice, onSale: e.onSale };
  });
  var lines = findings.map(findingStr);
  lines.push("");
  lines.push("Variations: " + variations.length + ", parents: " + perParent.length +
    ", findings: " + findings.length + ", errors: " + errors + ", warnings: " + warnings);
  lines.push("On sale: " + onSale + ", variations with no price: " + noPrice + ", duplicate SKUs: " + dupSkus);
  lines.push("");
  lines.push("Per-parent summary:");
  lines.push(padRight("parent", 10) + " " + padLeft("variations", 10) + " " + padLeft("min price", 11) +
    " " + padLeft("max price", 11) + " " + padLeft("on sale", 7));
  perParent.forEach(function (entry) {
    lines.push(padRight(entry.parent, 10) + " " + padLeft(entry.variations, 10) + " " +
      padLeft(fmtMoney(entry.minPrice), 11) + " " + padLeft(fmtMoney(entry.maxPrice), 11) +
      " " + padLeft(entry.onSale, 7));
  });
  if (findings.length === 0) { lines.push(""); lines.push("All variations clean."); }
  return lines.join("\n") + "\n";
};
